# sources.yaml — источники приёмов студии
sources:
  - id: ref-01
    title: "single-question"
    source: "references/sources.yaml#metric-report"
    takeaway: "Отчёт отвечает на один вопрос; каждая метрика связывается с решением, а не с любопытством."
  - id: ref-02
    title: "denominator"
    source: "references/sources.yaml#metric-report"
    takeaway: "Рядом с абсолютным числом всегда стоит знаменатель и период — иначе рост не интерпретируем."
  - id: ref-03
    title: "sql-nullable"
    source: "references/sources.yaml#sql-audit"
    takeaway: "Аудит SQL проверяет JOIN на размножение строк и обработку NULL в агрегатах."
  - id: ref-04
    title: "idempotent-etl"
    source: "references/sources.yaml#etl-pipeline"
    takeaway: "ETL идемпотентен: повторный запуск не дублирует строки (ON CONFLICT / MERGE по бизнес-ключу)."
  - id: ref-05
    title: "schema-first"
    source: "references/sources.yaml#schema-validate"
    takeaway: "Схема входа объявляется до загрузки; данные валидируются против неё до записи."
  - id: ref-06
    title: "dashboard-question"
    source: "references/sources.yaml#dashboard-spec"
    takeaway: "Спека дашборда начинается с решения: каждая метрика отвечает на вопрос владельца и имеет формулу и фильтры."
  - id: ref-07
    title: "quality-profile"
    source: "references/sources.yaml#quality-profile"
    takeaway: "Профиль качества (nulls, duplicates, types, row_count) — база доверия к метрикам."