name: etl-pipeline
title: "ETL-пайплайн"
description: "Собирает ETL-скрипт загрузки в хранилище: схема входа, upsert по бизнес-ключу, параметризованные запросы, обработка ошибок и пустого результата, хеширование PII."
source: "REF-04"
takeaway: "ETL обязан быть идемпотентным: повторный запуск не дублирует строки (ON CONFLICT / MERGE по бизнес-ключу)."
inputs: [brief, deliverable_dir, "analysis/schema.json"]
outputs: [analysis]
steps:
  - "Зафиксировать схему входа и бизнес-ключ"
  - "Написать upsert-запрос с параметризацией (без f-string)"
  - "Обработать ошибки подключения и пустой вход"
  - "Псевдонимизировать PII (hash, исходник не хранить)"
  - "Проверить идемпотентность и pinned-версии"
checks:
  - "V-01 SQL синтаксически валиден"
  - "V-05 Обработка ошибок и пустого результата"
  - "V-08 Параметризация против инъекций"
  - "V-09 Идемпотентность ETL"
  - "V-10 Валидация входа по схеме"
  - "V-14 PII маскируется/хешируется"
  - "Q-03 Докстринги для непубличных блоков"
applies_to: [data]