name: dashboard-spec
title: "Спека дашборда"
description: "Описывает панель метрик до сборки: вопрос владельца, метрики с формулами и фильтрами, компоновка, бюджет плана и время запроса."
source: "REF-06"
takeaway: "Спека дашборда начинается с решения: каждая метрика отвечает на вопрос владельца и имеет формулу и фильтры."
inputs: [brief, deliverable_dir]
outputs: [analysis]
steps:
  - "Сформулировать вопрос владельца и период"
  - "Определить метрики: формула, знаменатель, фильтры"
  - "Спроектировать панель (секции, порядок)"
  - "Оценить план и Execution Time в бюджете"
  - "Собрать спека-артефакт и передать на приёмку"
checks:
  - "V-12 Контроль стоимости сканирования"
  - "V-13 Время выполнения в бюджете"
  - "V-15 Метрики с формулой и значением"
  - "Q-01 Время запроса в бюджете"
  - "Q-02 Seq Scan на больших — 0"
applies_to: [data]