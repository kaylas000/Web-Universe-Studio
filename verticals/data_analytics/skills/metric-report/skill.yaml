name: metric-report
title: "Отчёт по метрикам"
description: "Собирает разбор: запросы, метрики с формулами, выводы и источник данных. Каждая метрика отвечает на вопрос владельца, рядом со значением — знаменатель и период."
source: "REF-01"
takeaway: "Отчёт отвечает на один вопрос; каждая метрика связывается с решением, а не с любопытством."
inputs: [brief, deliverable_dir]
outputs: [analysis]
steps:
  - "Определить вопрос владельца и период"
  - "Написать SQL-запросы с явными колонками"
  - "Посчитать метрики с формулами и знаменателями"
  - "Профилировать качество данных (nulls/дубликаты/типы)"
  - "Сформулировать выводы и указать источник"
checks:
  - "V-11 Метрики качества данных"
  - "V-15 Каждая метрика с формулой и значением"
  - "Q-04 Дубликаты в результате — 0"
  - "Q-05 Доля null под порогом"
applies_to: [data]