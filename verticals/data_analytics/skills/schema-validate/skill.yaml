name: schema-validate
title: "Валидация входа по схеме"
description: "Объявляет схему входа (schema.json) и валидирует данные до записи: типы, обязательные ключи, допустимые значения — мусор не попадает в хранилище (К-10)."
source: "REF-05"
takeaway: "Схема входа объявляется до загрузки; данные валидируются против неё до записи."
inputs: [brief, deliverable_dir]
outputs: [analysis]
steps:
  - "Разобрать бриф и входные данные"
  - "Собрать артефакт по закону студии"
  - "Прогнать приёмку (V-xx)"
  - "Зафиксировать нарушения и закрыть их"
checks:
  - "validate.mjs → exit 0"
  - "lint-quotas.mjs → exit 0"
applies_to: [data]
