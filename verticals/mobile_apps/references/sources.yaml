# sources.yaml — источники приёмов студии
sources:
  - id: ref-01
    title: "thumb-zone"
    source: "references/sources.yaml#screen-composer"
    takeaway: "Главные действия — в нижней трети экрана, в зоне большого пальца."
  - id: ref-02
    title: "platform-nav"
    source: "references/sources.yaml#screen-composer"
    takeaway: "Навигация следует платформе: таб-бар снизу на iOS, системная панель на Android."
  - id: ref-03
    title: "touch-target"
    source: "references/sources.yaml#a11y-pass"
    takeaway: "Цель нажатия не меньше 44×44 px и отделена от соседей видимым зазором."
  - id: ref-04
    title: "offline-cache"
    source: "references/sources.yaml#offline-queue"
    takeaway: "Offline-режим — это кэш последних данных плюс очередь мутирующих запросов: сеть пропала — экран живёт кэшем, запросы встают в очередь и уходят при восстановлении (К-07, К-17)."
  - id: ref-05
    title: "store-assets"
    source: "references/sources.yaml#store-release"
    takeaway: "Стор принимает приложение по трём артефактам: иконка 1024×1024 без прозрачности, скриншоты 6.5\" и 5.5\", и описание ценности для пользователя (К-20)."
  - id: ref-06
    title: "i18n-keys"
    source: "references/sources.yaml#i18n-pass"
    takeaway: "Локализация живёт ключами: en.json и ru.json — единственный источник текста, в коде только ключи, без хардкода строк (К-14, B-04)."
  - id: ref-07
    title: "flow-real-apps"
    source: "references/sources.yaml#mobbin-flows"
    takeaway: "Флоу рисуй по реальным приложениям: онбординг → чекаут → настройки, по OS, а не из головы (mobbin.com)."
  - id: ref-08
    title: "pattern-library"
    source: "references/sources.yaml#pttrns"
    takeaway: "Пустые состояния, кнопки и табы берутся из библиотек паттернов, а не придумываются заново (pttrns.com)."
  - id: ref-09
    title: "platform-lang"
    source: "references/sources.yaml#mobile-patterns"
    takeaway: "iOS и Android говорят по-разному (HIG vs Material): дизайн следует платформе, иначе приложение кажется чужим (mobile-patterns.com)."
  - id: ref-10
    title: "store-preview"
    source: "references/sources.yaml#scrnshts"
    takeaway: "Превью в сторе — маркетинговые скриншоты 6.5\" и 5.5\" как продающая история, а не снимок экрана (scrnshts.club)."
  - id: ref-11
    title: "nav-patterns"
    source: "references/sources.yaml#uigarage"
    takeaway: "Навигацию выбирай из проверенных паттернов (Tab Bar, Navigation, Cards), а не изобретай с нуля (uigarage.net)."
  - id: ref-12
    title: "mobile-components"
    source: "references/sources.yaml#collectui-mobile"
    takeaway: "Компонент мобильного экрана берётся из реальных паттернов (фильтр Mobile), а не рисуется с нуля (collectui.com)."
  - id: ref-13
    title: "contrast-ratio"
    source: "references/sources.yaml#a11y-pass"
    takeaway: "Контраст текста к фону — не ниже 4.5:1 (WCAG 2.1 AA); пары темы выносятся в токены (app/theme.json) и проверяются расчётом, а не глазами."
  - id: ref-14
    title: "nng-heuristics"
    source: "references/sources.yaml#nng-heuristics"
    takeaway: "Десять эвристик NN/g: видимость статуса, соответствие реальному миру, свобода и контроль, консистентность, предотвращение ошибок, распознавание вместо припоминания, гибкость, эстетика, восстановление после ошибки, справка; проверяемое ядро (статус/стек/retry/подписи/справка) машинизируется прокси-сканом V-23."
  - id: ref-15
    title: "mobile-typography"
    source: "references/sources.yaml#material-typography"
    takeaway: "Типографика задаётся явными атрибутами: базовый кегль ≥ 16, контент ≥ 14, интерлиньяж ≥ 20; мелкие кегли и удушающее межстрочное — нарушение норм (V-24)."
  - id: ref-16
    title: "rn-animations"
    source: "references/sources.yaml#rn-animations"
    takeaway: "Анимация на 60fps — нативный драйвер и кадровая модель: Animated.timing/spring с useNativeDriver: true, requestAnimationFrame/Easing; длинные setTimeout на главном потоке — тормоза (V-25)."
  - id: ref-17
    title: "human-voice"
    source: "references/sources.yaml#humanizer-ru"
    takeaway: "Экспертный текст без следов ИИ: факты и числа вместо клише, глагол вместо «представляет собой», ноль артефактов копипаста (oaicite, utm_source=chatgpt.com, 【…†…】); проверяется детерминированным сканом lint-copy (A-xx/C-xx/N-xx/R-xx, балл 0-100; smixs/humanizer-ru, ilyautov/humanizer-ru, stop-slop — MIT)."
