name: offline-queue
title: "Офлайн-очередь (offline-queue)"
description: >
  Аудит offline-режима по закону К-07: кэш последних данных в локальном хранилище
  и очередь мутирующих запросов с NetInfo listener. К-17: retry-логика с паузой
  и лимитом попыток, user-friendly сообщения об ошибках. Артефакт не меняет —
  только верифицирует и возвращает точечные правки.
source: "REF-04"
takeaway: >
  Offline-режим — это кэш последних данных плюс очередь мутирующих запросов:
  сеть пропала — экран живёт кэшем, запросы встают в очередь и уходят при
  восстановлении связи (К-07, К-17).
inputs: [app, net_report]
outputs: [offline_report]
steps:
  - "Подключить NetInfo listener: слушать потерю и восстановление сети (К-07)"
  - "Кэшировать последние данные в локальное хранилище; экран читает кэш при offline (К-07)"
  - "Мутирующие запросы складывать в очередь и выполнять при восстановлении связи (К-07)"
  - "Добавить retry: экспоненциальная пауза, лимит попыток, отмена при уходе с экрана (К-17)"
  - "User-friendly ошибки: понятное сообщение и кнопка повтора вместо тихого падения (К-17)"
  - "Проверить квоту Q-06: размер кэша на диске ≤ 100MB"
checks:
  - "К-07 Offline-режим: кэш и очередь запросов"
  - "К-17 Retry и ошибки: try-catch с UI-фидбеком"
  - "Q-06 Размер кэша на диске ≤100MB"
applies_to: [mobile_apps]
codes:
  - "Q-06"
  - "V-07"
  - "V-17"
evidence:
  require:
    - "NetInfo|connectivity|online"
    - "queue|cache"
  forbid:
    - "—"
  files:
    - "app/**/*.{json,js,mjs,ts,tsx,jsx,dart,swift,kt,md}"
