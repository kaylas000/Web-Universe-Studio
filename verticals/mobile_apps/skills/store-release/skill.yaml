name: store-release
title: "Готовность к сторам (store-release)"
description: >
  Проверяет готовность к публикации по закону К-20: иконка 1024×1024 без
  прозрачности (assets/icon-1024.png), скриншоты 6.5" и 5.5" (screenshots/),
  описание на языке стора. Артефакт не меняет — только верифицирует и возвращает
  точечные правки по списку сторов (App Store / Google Play).
source: "REF-05"
takeaway: >
  Стор принимает приложение по трём артефактам: иконка 1024×1024 без
  прозрачности, скриншоты 6.5" и 5.5", и описание ценности для пользователя (К-20).
inputs: [app, store_assets]
outputs: [store_report]
steps:
  - "Проверить иконку assets/icon-1024.png: размер 1024×1024, без alpha-канала (К-20)"
  - "Проверить скриншоты: 6.5\" (iPhone) и 5.5\" в screenshots/ с манифестом (К-20)"
  - "Проверить описание: что делает приложение и зачем, на языке стора, без штампов"
  - "Сверить экраны со скриншотами: реальные разрешения, тёмная тема (К-18, К-05)"
  - "Проверить квоту Q-01: размер APK / IPA ≤ 50MB (без on-demand)"
  - "Зафиксировать отчёт готовности: иконка, скриншоты, описание, store.json"
checks:
  - "К-20 Готовность к сторам: иконка 1024×1024, скриншоты 6.5\" + 5.5\", описание"
  - "К-18 Тестирование на 5+ разрешениях"
  - "К-05 Тёмная тема"
  - "Q-01 Размер APK / IPA ≤50MB"
applies_to: [mobile_apps]