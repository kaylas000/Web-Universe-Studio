name: i18n-pass
title: "Локализация (i18n-pass)"
description: >
  Аудит локализации по закону К-14: минимум два языка (en + ru) через i18n —
  ключи в locales/en.json и locales/ru.json, ни одной хардкод-строки в коде
  (B-04). Проверяет полноту ключей, плюралы и форматы дат/чисел под локаль.
  Артефакт не меняет — только верифицирует и возвращает точечные правки.
source: "REF-06"
takeaway: >
  Локализация живёт ключами, а не строками: en.json и ru.json — единственный
  источник текста, в коде только ключи, без хардкода (К-14, B-04).
inputs: [app, locales]
outputs: [i18n_report]
steps:
  - "Собрать все строки из app/src: в коде остаются только ключи i18n (B-04)"
  - "Сверить locales/en.json и locales/ru.json: одинаковый набор ключей (К-14)"
  - "Проверить плюралы и формат дат/чисел под локаль (i18next/intl)"
  - "Проверить переводы: близко к смыслу оригинала, длина вписывается в лейаут"
  - "Прогнать lint-slop: хардкод-строки запрещены (B-04) и вернуть точечные правки"
checks:
  - "К-14 Локализация минимум на 2 языка (en + ru) через i18n"
  - "B-04 Хардкод строк без i18n"
applies_to: [mobile_apps]
codes:
  - "V-14"
  - "V-27"
evidence:
  require:
    - "\.json"
    - "t\(|\"ru\"|\"en\""
  forbid:
    - "—"
  files:
    - "app/**/*.{json,js,mjs,ts,tsx,jsx,dart,swift,kt,md}"
