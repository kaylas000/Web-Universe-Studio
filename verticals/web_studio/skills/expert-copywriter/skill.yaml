  - "Снять манеру ИИ. Канцелярит и штампы-связки, faux-insight («по сути», «если копнуть глубже»),"
  - "Живой ритм. Разбивать предложения длиннее 45 слов; менять длину — абзац не должен быть"
  - "Править удалением. Не дописывать «голос» от себя — убирать лишнее и заменять абстракцию фактом."
