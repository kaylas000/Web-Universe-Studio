# sources.yaml — источники приёмов студии
sources:
  - id: ref-01
    title: "backward-design"
    source: "references/sources.yaml#lesson-plan"
    takeaway: "Урок проектируется от результата: сначала проверка, потом материал под неё."
  - id: ref-02
    title: "single-objective"
    source: "references/sources.yaml#lesson-plan"
    takeaway: "Один урок — один измеримый результат, сформулированный глаголом действия."
  - id: ref-03
    title: "distractor-design"
    source: "references/sources.yaml#quiz-builder"
    takeaway: "Дистракторы отражают типичные ошибки ученика, а не случайные числа."
  - id: ref-04
    title: "bloom-goals"
    source: "references/sources.yaml#course-syllabus"
    takeaway: "Цели курса пишутся глаголами таксономии Блума и маппятся на модули и аттестацию: каждая цель измерима, прогрессия шагает на один уровень, аттестация покрывает все цели (К-01, К-15)."
  - id: ref-05
    title: "feedback-loop"
    source: "references/sources.yaml#formative-check"
    takeaway: "Формативная оценка — петля, а не аттестация: короткий вопрос после каждого блока, обратная связь в момент ошибки и повторная попытка, пока материал не закреплён (К-06, К-13)."
  - id: ref-06
    title: "load-estimate"
    source: "references/sources.yaml#course-syllabus"
    takeaway: "Нагрузка курса считается по минутам на урок — «≈ N мин по M урокам»: урок в окне 10–60 минут, сумма сходится с числом уроков, интерактив идёт не реже раза в 10 минут (К-05, К-11, Q-05)."