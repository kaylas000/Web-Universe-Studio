name: lesson-plan
title: "План урока"
description: "Собирает урок по закону студии: цель глаголом таксономии Блума (К-01), блоки «Цель/Теория/Практика/Итог» (К-04), интерактив ≥1 на 10 минут (К-05), формативная оценка после каждого блока (К-06), разбор ошибок и обратная связь (К-13), мультимодальность (К-14)."
source: "REF-01, REF-02"
takeaway: "Урок проектируется от результата (backward design): сначала проверка и итог, потом материал под них; один урок — один измеримый результат, сформулированный глаголом действия."
inputs: [brief, audience, deliverable_dir]
outputs: [course/lesson-01.md, course/README.md, course/quiz.json, course/SOURCES.md]
steps:
  - "Сформулировать одну цель глаголом таксономии Блума (К-01, REF-02)"
  - "Разбить урок на блоки «Цель/Теория/Практика/Итог» (К-04)"
  - "Вставить интерактив — минимум один на 10 минут материала (К-05, Q-01)"
  - "Поставить формативную оценку после каждого блока (К-06, Q-02)"
  - "Собрать типичные ошибки в раздел «Разбор ошибок» с обратной связью (К-13)"
  - "Определить термины при первом использовании (К-10)"
  - "Указать источники и реалистичное время прохождения (К-11, К-12)"
checks:
  - "scripts/validate.mjs projects/<имя> → ИТОГ: N/N · exit 0 (V-01…V-20)"
  - "scripts/lint-slop.mjs projects/<имя> → чисто: (B-01…B-07)"
  - "scripts/lint-quotas.mjs projects/<имя> → квоты Q-01…Q-05 в норме"
  - "tools/quiz-audit.mjs и tools/load-estimator.mjs → ok"
applies_to: [education]