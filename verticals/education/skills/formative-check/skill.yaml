name: formative-check
title: "Формативная оценка"
description: "Встраивает проверку понимания после каждого блока урока (К-06), даёт мгновенную обратную связь и разбор ошибок (К-13), ведёт ученика к мастерству через право на повторную попытку (REF-05)."
source: "REF-05"
takeaway: "Формативная оценка — не аттестация: короткий вопрос после каждого блока, обратная связь в момент ошибки и повторная попытка, пока материал не закреплён."
inputs: [lesson_blocks, brief, deliverable_dir]
outputs: [course/lesson-N.md — разделы «Проверка понимания» и «Разбор ошибок»]
steps:
  - "Выделить блоки урока: теория, практика, визуал (К-14)"
  - "После каждого блока поставить вопрос на понимание (К-06, Q-02)"
  - "Для каждого вопроса задать обратную связь при ошибке (К-13)"
  - "Собрать типичные ошибки в раздел «Разбор ошибок»"
  - "Прогнать V-06, V-13 и квоту Q-02"
checks:
  - "«Проверка понимания» ≥ 2 в course/lesson-01.md (V-06, Q-02)"
  - "«Разбор ошибок» + «Обратная связь» на месте (V-13)"
  - "ни один блок урока не остался без проверки (Q-02 — 100 %)"
applies_to: [education]