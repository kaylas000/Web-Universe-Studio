name: glossary-builder
title: "Глоссарий терминов"
description: "Определяет термины и единицы измерения при первом использовании (К-10): раздел «Термины» в уроке, определение до первого употребления, единицы у чисел разбираются один раз."
source: "REF-06"
takeaway: "Термин определён до первого использования, определение из 1–2 предложений без новых терминов; числа сопровождаются единицами, единицы вводятся один раз."
inputs: [lesson_text, brief, deliverable_dir]
outputs: [course/lesson-N.md — раздел «Термины»]
steps:
  - "Выписать все впервые встречающиеся термины и единицы измерения"
  - "Определить каждый в разделе «Термины»: 1–2 предложения, без новых терминов (REF-06)"
  - "Сверить, что первое употребление термина идёт после определения"
  - "Проверить числа: у каждого указана единица, единица определена"
  - "Прогнать tools/glossary-check.mjs и V-10"
checks:
  - "раздел «Термины» с ≥ 2 определениями (V-10)"
  - "tools/glossary-check.mjs → ok: термины определены, определения не короче 8 символов"
  - "B-04: нет неопределённого жаргона в теле урока"
applies_to: [education]