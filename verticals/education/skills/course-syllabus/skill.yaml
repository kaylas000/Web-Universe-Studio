name: course-syllabus
title: "Программа курса"
description: "Собирает программу курса: цели по таксономии Блума (К-01), прогрессия от простого к сложному с графом зависимостей (К-02), соответствие учебному плану/стандарту (К-08), аттестация, покрывающая цели (К-15), реалистичная оценка времени (К-11)."
source: "REF-04"
takeaway: "Программа — это граф зависимостей: каждый следующий урок опирается только на предыдущий, шаг сложности не превышает один уровень, цели маппятся на модули и аттестацию."
inputs: [brief, audience, standard, deliverable_dir]
outputs: [course/README.md]
steps:
  - "Утвердить целевой результат курса (backward design, REF-01)"
  - "Разбить курс на 3+ урока по возрастанию сложности (К-02, V-02)"
  - "Сформулировать цели каждого урока глаголами Блума (К-01, V-01)"
  - "Смаппировать цели на учебный план/стандарт (К-08, V-08)"
  - "Спланировать аттестацию, покрывающую цели (К-15, V-15)"
  - "Оценить суммарное время и время на урок (К-11, Q-05)"
checks:
  - "scripts/validate.mjs → exit 0 (V-01, V-02, V-08, V-15)"
  - "tools/load-estimator.mjs → «≈ N мин по M урокам» сходится"
  - "граф зависимостей: «Урок N» опирается только на «Урок N−1»"
applies_to: [education]