name: quiz-builder
title: "Тест-конструктор"
description: "Собирает тест с валидными дистракторами: один правильный ответ, варианты без дублей, объяснение каждого вопроса (К-07), не менее 3 вопросов на урок (Q-03), покрытие заявленных целей аттестацией (К-15)."
source: "REF-03"
takeaway: "Дистракторы отражают типичные ошибки ученика, а не случайные числа: каждый неверный вариант правдоподобен ровно до объяснения, ответ входит в варианты ровно один раз."
inputs: [lesson_goals, brief, deliverable_dir]
outputs: [course/quiz.json]
steps:
  - "Выписать цели урока (К-01) — каждый вопрос покрывает хотя бы одну (К-15)"
  - "Сформулировать вопрос одним предложением без подсказки в формулировке"
  - "Дать один верный ответ и 2–4 дистрактора из типичных ошибок (REF-03)"
  - "Написать объяснение: почему верен ответ и чем опасны дистракторы (К-07, B-01)"
  - "Прогнать tools/quiz-audit.mjs и scripts/lint-quotas.mjs (Q-03)"
checks:
  - "tools/quiz-audit.mjs → ответ ∈ варианты ровно 1 раз, варианты уникальны, объяснение ≥ 20 символов"
  - "scripts/validate.mjs → exit 0 (V-07, V-17)"
  - "scripts/lint-quotas.mjs → Q-03 в норме (3–12 вопросов)"
applies_to: [education]