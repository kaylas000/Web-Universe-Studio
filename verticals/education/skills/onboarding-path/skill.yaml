name: onboarding-path
title: "Онбординг-путь"
description: "Собирает путь введения новичка в домен: шаги от простого к сложному без скачков (К-02), возрастная адекватность лексики и примеров (К-03), интерактивы (К-05), доступность (К-09), термины при первом использовании (К-10)."
source: "REF-07"
takeaway: "Онбординг — лестница с перилами: шаг не больше одного уровня сложности, у каждого шага измеримая цель по Блуму, интерактив и проверка понимания; первый день — предсказуемый список шагов."
inputs: [brief, audience_profile, available_materials, deliverable_dir]
outputs: [course/ — программа и первый шаг пути]
steps:
  - "Зафиксировать профиль новичка: что умеет, чего боится (К-03)"
  - "Построить путь шагами без скачков больше одного уровня (К-02"
  - "Каждому шагу — цель по Блуму и интерактив (К-01, К-05)"
  - "Проверить лексику и примеры на возраст/уровень подготовки (К-03"
  - "Заложить доступность: контраст, alt, субтитры (К-09)"
  - "Собрать первый шаг в course/lesson-01.md, программу — в course/README.md, тест — в course/quiz.json"
checks:
  - "scripts/validate.mjs → exit 0 (V-01…V-20)"
  - "tools/load-estimator.mjs → время шага реалистично (10–60 мин)"
  - "scripts/lint-slop.mjs → чисто: (B-01…B-07)"
  - "scripts/lint-quotas.mjs → квоты Q-01…Q-05 в норме"
applies_to: [education]