# sources.yaml — источники приёмов студии
sources:
  - id: ref-01
    title: "one-thesis"
    source: "references/sources.yaml#longform-post"
    takeaway: "Один длинный текст держит один тезис; каждый абзац продвигает его, а не повторяет сказанное."
  - id: ref-02
    title: "concrete-open"
    source: "references/sources.yaml#longform-post"
    takeaway: "Первая фраза начинается с факта или сцены, а не с обобщения вроде «в современном мире»."
  - id: ref-03
    title: "read-aloud"
    source: "references/sources.yaml#copy-edit"
    takeaway: "Правку читают вслух: спотыкание на слоге — сигнал переписать предложение короче."
  - id: ref-04
    title: "seo-meta"
    source: "references/sources.yaml#seo-meta"
    takeaway: "SEO-мета и призыв — обещание страницы: title 50–60, description 120–158 символов, JSON-LD по типу контента, CTA с data-analytics-event."
  - id: ref-05
    title: "link-graph"
    source: "references/sources.yaml#link-audit"
    takeaway: "Ссылки строят граф: ≥2 внутренних переходов на связанные материалы и внешние авторитетные источники с осмысленными якорями."
  - id: ref-06
    title: "typography-rules"
    source: "references/sources.yaml#typography"
    takeaway: "Редполитика: ёлочки «», длинное тире —, неразрывные пробелы после предлогов и никаких висячих предлогов в конце строк."