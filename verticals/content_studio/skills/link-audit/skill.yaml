name: link-audit
title: "Аудит ссылок"
description: "Проверяет ссылочный граф по закону студии: ≥2 внутренних ссылок на связанные материалы (К-06), авторитетные внешние источники, осмысленные якоря вместо «здесь»."
source: "REF-05"
takeaway: "Ссылки строят граф: ≥2 внутренних переходов на смежные материалы и внешние авторитетные источники."
inputs: [brief, deliverable_dir, "content/post.md", "content/SOURCES.md"]
outputs: [content]
steps:
  - "Собрать все ссылки артефакта"
  - "Проверить ≥2 внутренних ссылок на связанные материалы"
  - "Проверить авторитетность внешних источников"
  - "Проверить якоря: без пустых «здесь» и «подробнее»"
  - "Зафиксировать нарушения в отчёте"
checks:
  - "К-06 ≥2 внутренних + авторитетные внешние ссылки"
  - "V-06 линк-аудит в приёмке студии"
  - "B-05 факт без источника"
applies_to: [content_studio]