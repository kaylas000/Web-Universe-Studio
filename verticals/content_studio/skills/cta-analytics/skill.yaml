name: cta-analytics
title: "CTA с аналитикой"
description: "Проверяет призывы к действию по закону студии: каждый CTA несёт data-analytics-event (К-14), изображения с alt и оптимизированным форматом (К-11), CTA соответствует цели брифа."
source: "REF-04"
takeaway: "Призыв измерим: у CTA есть data-analytics-event, у изображений — alt, иначе конверсию не отследить."
inputs: [brief, deliverable_dir, "content/post.md"]
outputs: [content]
steps:
  - "Найти все CTA в артефакте"
  - "Проверить у каждого data-analytics-event"
  - "Проверить изображения: alt и формат"
  - "Сверить CTA с целью брифа: один призыв, не два"
  - "Зафиксировать нарушения в отчёте"
checks:
  - "К-14 CTA с data-analytics-event"
  - "К-11 изображения с alt и оптимизированным форматом"
  - "V-14 CTA с событием аналитики в приёмке студии"
applies_to: [content_studio]