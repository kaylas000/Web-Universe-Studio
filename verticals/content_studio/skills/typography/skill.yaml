name: typography
title: "Типографика и редполитика"
description: "Приводит текст к редполитике студии (К-13): типографские кавычки «ёлочки», длинное тире —, неразрывные пробелы после предлогов, без висячих предлогов и дефис-минусов."
source: "REF-06"
takeaway: "Типографика — это порядок: ёлочки «», длинное тире —, неразрывные пробелы, без висячих предлогов."
inputs: [brief, deliverable_dir, "content/post.md"]
outputs: [content]
steps:
  - "Проверить кавычки: только ёлочки «», без лапок"
  - "Заменить дефис-минус на длинное тире —"
  - "Вставить неразрывные пробелы после предлогов"
  - "Убрать висячие предлоги в конце строк"
  - "Прогнать typographer.mjs и сверить счётчик замен"
checks:
  - "К-13 редполитика: типографика, тире, кавычки, без висячих предлогов"
  - "V-13 дефис-минус не используется как тире"
  - "Q-05 абзац ≤ 5 предложений"
applies_to: [content_studio]