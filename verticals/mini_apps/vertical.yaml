# ЦЕХ · метаплатформа — декларативное описание студии (§8 ТЗ).
# metadata.* и spec.* читает ядро; metadata.deliverable/checks — маркеры приёмки гейта.
apiVersion: autogen/v1
kind: Vertical
metadata:
  name: mini_apps
  displayName: "Студия мини-приложений"
  description: "Собирает Telegram/VK Mini Apps: магазины внутри Telegram, сервисы записи, мини-игры, дашборды. Стек React/Vue + Telegram WebApp SDK / VK Bridge; артефакт — лёгкий бандл app/ (< 300KB gzip), нативные элементы SDK, темы theme_params, safe area, Telegram Payments."
  version: "2.4.0"
  domain: mini_apps
  tags: [single-page-app, a11y-pass, telegram-sdk, payments, viewport-adaptive, offline-worker, usability-heuristics]
  deliverable: app
  checks: [validate, lint-slop]
spec:
  skills: [single-page-app, a11y-pass, telegram-sdk, payments, viewport-adaptive, offline-worker, usability-heuristics]
  validators: [constitution, anti_slop, schema, llm_judge]
  gates: [G1-direction, G2-structure, G3-artifact, G4-final]
  tools: [validate_artifact, lint_slop, lint_quotas, initdata_check]
  registry: "registry.mjs"
  models:
    planner: "ollama/llama3.1:8b"
    coder: "ollama/qwen2.5-coder:7b"
    verifier_llm: "ollama/gemma2:9b"
    fixer: "ollama/llama3.1:8b"
  budget:
    max_cost_usd_per_run: 1.5
    max_iterations: 10
    max_tokens_per_run: 120000
  knowledge:
    provider: local
    rag_collections:
      - name: mini_apps_references
        source: "verticals/mini_apps/references"
  anti_slop:
    banned_file: "anti-slop/BANNED.md"
    quotas_file: "anti-slop/QUOTAS.md"