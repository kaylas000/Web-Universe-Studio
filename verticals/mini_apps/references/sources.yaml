# sources.yaml — источники приёмов студии
sources:
  - id: ref-01
    title: "one-screen"
    source: "references/sources.yaml#single-page-app"
    takeaway: "Экран решает одну задачу; вторичные действия уходят в меню, а не теснятся рядом."
  - id: ref-02
    title: "instant-feedback"
    source: "references/sources.yaml#single-page-app"
    takeaway: "Каждое нажатие отвечает в пределах 100 мс — сменой состояния, а не спиннером."
  - id: ref-03
    title: "focus-visible"
    source: "references/sources.yaml#a11y-pass"
    takeaway: "Фокус виден на каждом интерактивном элементе; порядок обхода совпадает с визуальным."
  - id: ref-04
    title: "invoice-initdata"
    source: "references/sources.yaml#payments"
    takeaway: "Оплата — только Telegram Payments: openInvoice/sendData вместо внешних ссылок; перед обработкой платежа бэкенд проверяет подпись initData через HMAC-SHA256."
  - id: ref-05
    title: "viewport-safearea"
    source: "references/sources.yaml#viewport-adaptive"
    takeaway: "Адаптация 320/375/420 — media-запросы и ограниченная ширина; низ экрана — через env(safe-area-inset-bottom), высота — через viewportChanged, а не жёсткий 100vh."
  - id: ref-06
    title: "offline-sw"
    source: "references/sources.yaml#offline-worker"
    takeaway: "Базовый offline — кэш оболочки в Service Worker (install → addAll, fetch → cache-first) и его регистрация; состояние переживает закрытие через CloudStorage/sendData."
  - id: ref-07
    title: "tma-entry"
    source: "references/sources.yaml#tma-gallery"
    takeaway: "Витрина TMA — категория (Shop/Game/Utility/Finance), описание и сразу живая кнопка: понятно за секунду, зачем открывать (tma.gallery)."
  - id: ref-08
    title: "tma-review"
    source: "references/sources.yaml#miniapp-cafe"
    takeaway: "Обзор мини-приложения начинается с назначения и аудитории, а не с перечисления фич (miniapp.cafe)."
  - id: ref-09
    title: "tma-niche-charts"
    source: "references/sources.yaml#tgstat"
    takeaway: "Нишу проверяй статистикой RU-сегмента: топ-чарты и онбординги, которые реально привели пользователей (tgstat.ru)."
  - id: ref-10
    title: "tma-ui-concept"
    source: "references/sources.yaml#dribbble-tma"
    takeaway: "Концепт TMA-интерфейса — платформенная сетка плюс одна яркая деталь, а не перерисовка всего с нуля (dribbble: Telegram Mini App UI)."
  - id: ref-11
    title: "tma-case"
    source: "references/sources.yaml#behance-tma"
    takeaway: "Кейс мини-приложения убеждает метриками (установки, удержание), а не только скриншотами (behance: Mini app case study)."
  - id: ref-12
    title: "contrast-ratio"
    source: "references/sources.yaml#a11y-pass"
    takeaway: "Контраст текста к фону — не ниже 4.5:1 (WCAG 2.1 AA); пары темы выносятся в токены (app/theme.json) и проверяются расчётом, а не глазами."
  - id: ref-13
    title: "nng-heuristics"
    source: "references/sources.yaml#nng-heuristics"
    takeaway: "Десять эвристик NN/g: видимость статуса, соответствие реальному миру, свобода и контроль, консистентность, предотвращение ошибок, распознавание вместо припоминания, гибкость, эстетика, восстановление после ошибки, справка; проверяемое ядро (статус/выход/подписи/отклик/справка) машинизируется прокси-сканом V-22."
  - id: ref-14
    title: "cta-conversion"
    source: "references/sources.yaml#baymard-cta"
    takeaway: "Конверсия — одна цель и конкретика: единственный primary CTA (MainButton), CTA-глагол, число вместо абстракций (исследования CTA-форм, baymard.com)."