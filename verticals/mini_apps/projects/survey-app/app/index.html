<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Опросник</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="survey">
      <h1 class="survey__title">Опросник студии</h1>
      <p class="survey__hint">Три коротких вопроса — ответы уйдут боту, а черновик сохранится.</p>
      <form class="survey__form" id="form">
        <label class="survey__question" for="q1">1. Как часто вы пользуетесь мини-приложениями?</label>
        <select class="survey__select" id="q1" name="freq">
          <option value="daily">Каждый день</option>
          <option value="weekly">Раз в неделю</option>
          <option value="rarely">Реже раза в месяц</option>
        </select>
        <label class="survey__question" for="q2">2. Что для вас важнее всего?</label>
        <input class="survey__input" id="q2" name="priority" maxlength="140" placeholder="Скорость, удобство, дизайн" />
        <label class="survey__question" for="q3">3. Порекомендуете ли приложение друзьям?</label>
        <select class="survey__select" id="q3" name="nps">
          <option value="9">9–10 · обязательно</option>
          <option value="7">7–8 · скорее да</option>
          <option value="0">0–6 · нет</option>
        </select>
      </form>
      <p class="survey__note" id="note" role="status" aria-live="polite"></p>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
