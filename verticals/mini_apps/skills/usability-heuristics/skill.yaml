name: usability-heuristics
title: "Эвристики юзабилити NN/g"
description: "Доводит экран мини-приложения до проверяемого ядра эвристик Нильсена: системный статус, свобода выхода, распознавание вместо припоминания, отклик на действие и вход в справку (REF-14). Провал любой эвристики — точечная правка, а не перезапуск (К-10, К-22)."
source: REF-13
takeaway: "Десять эвристик NN/g сводятся к машине: статус, выход, распознавание, отклик и справка проверяются прокси-сканом (REF-13); остальное — чек-лист HEURISTICS.md и артдиректор."
inputs:
  - artifact_dir
  - heuristics_targets
outputs:
  - app/index.html (поправки)
  - app/app.js (поправки)
  - app/style.css (поправки)
  - heuristics-report.md
steps:
  - "Сверить экран с картой 10 эвристик NN/g (HEURISTICS.md): статус, соответствие, контроль, консистентность, предотвращение ошибок, распознавание, гибкость, эстетика, восстановление, справка"
  - "Проверить системный статус: role=\"status\"/aria-live на живом статусе (H1)"
  - "Проверить свободу выхода: BackButton.show()/onClick — из экрана можно выйти (H3)"
  - "Проверить распознавание: подписи <label> и текстовые кнопки вместо иконок без подписи (H6)"
  - "Проверить отклик: HapticFeedback на ключевом действии (H7)"
  - "Проверить справку: вход в документацию через SDK (openDocs/openHelp/openLink), не мёртвый текст (H10)"
  - "Зафиксировать heuristics-report.md"
checks:
  - "V-22 (allOf: статус/выход/распознавание/отклик/справка) из validate.mjs"
  - "HEURISTICS.md — карта эвристик и их прокси"
  - "B-07/B-08 в lint-slop (микрокопия CTA и ошибок)"
applies_to:
  - mini_apps
  - telegram-mini-app
  - vk-mini-app
  - usability
codes:
  - "B-05"
  - "B-08"
  - "B-09"
  - "V-19"
  - "V-22"
evidence:
  require:
    - "role=\"status\"|aria-live"
    - "BackButton"
  forbid:
    - "—"
  files:
    - "app/**/*.{html,css,js,mjs,json,md}"
