name: expert-copywriter
title: "Экспертный текст без следов ИИ (expert-copywriter)"
description: >
  Пишет и правит текст приложения как редактор-эксперт: факты и числа вместо клише,
  глагол вместо «представляет собой», запрет артефактов копипаста из чат-ботов.
  Держит человеческий ритм и снимает манеру ИИ (канцелярит, faux-insight, сервильность,
  дежурный финал). Текст проверяется детерминированным линтером scripts/lint-copy.mjs.
source: REF-16
takeaway: >
  Экспертность — это конкретика и глагол: число вместо «много», действие вместо
  «представляет собой», ноль артефактов чат-бота; стиль считается баллом 0-100,
  ошибки A-xx гейтят приёмку.
inputs: [app, copy_report]
outputs: [copy_report]
steps:
  - "Прочитать текст приложения (app/index.html, app.js) как редактор, а не как автор"
  - "Убрать артефакты копипаста: oaicite, turn…search, utm_source=chatgpt.com, 【…†…】, плейсхолдеры"
  - "Заменить клише и связки: «представляет собой/является/играет важную роль» → глагол; «много/быстро» → число"
  - "Снять манеру ИИ: канцелярит, faux-insight, сервильность, дежурный оптимистичный финал"
  - "Выровнять ритм: длинные (>45 слов) и монотонные предложения разбить"
  - "Прогнать node scripts/lint-copy.mjs: ошибок 0, балл не ниже 80"
checks:
  - "A-01…A-09 — артефакты копипаста (жёсткий гейт, scripts/copy.json)"
  - "C-xx/N-xx/R-xx — стиль и ритм (балл 0-100, сводка lint-copy)"
applies_to:
  - mini_apps
