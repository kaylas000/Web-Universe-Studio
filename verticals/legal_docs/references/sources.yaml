# sources.yaml — источники приёмов студии
sources:
  - id: ref-01
    title: "structure-nesting"
    source: "references/sources.yaml#contract-draft"
    takeaway: "Договор членится на разделы «Предмет → Обязанности → Ответственность → Срок»; нумерация 1.1/1.2 однозначна."
  - id: ref-02
    title: "defined-terms"
    source: "references/sources.yaml#contract-draft"
    takeaway: "Термины определяются один раз в разделе «Термины» и далее используются без синонимов."
  - id: ref-03
    title: "review-checklist"
    source: "references/sources.yaml#legal-review"
    takeaway: "Ревью идёт по чек-листу: стороны, предмет, цена, срок, ответственность, применимое право."
  - id: ref-04
    title: "cheksum-req"
    source: "references/sources.yaml#requisites"
    takeaway: "Реквизиты принимаются только после проверки контрольных сумм: ИНН — модуль 11, ОГРН — модуль 11/13 (К-05)."
  - id: ref-05
    title: "disputes"
    source: "references/sources.yaml#dispute-clause"
    takeaway: "Споры урегулируются только после обязательной претензии; ответственность не сводится к одной пене — убытки возмещаются в непокрытой части (К-08, К-09)."
  - id: ref-06
    title: "pdn"
    source: "references/sources.yaml#pdn-compliance"
    takeaway: "ПДн обрабатываются только при наличии цели, срока и согласия субъекта — иначе обработка без основания (К-07, 152-ФЗ)."
  - id: ref-07
    title: "versioning"
    source: "references/sources.yaml#versioning"
    takeaway: "Документ версионируется датой и номером редакции; сноска на НПА без редакции/даты считается нарушением (К-10, К-12)."