name: contract-draft
title: "Составление договора"
description: "Собирает договор из обязательных разделов с нумерацией пунктов и реквизитами сторон."
source: "REF-01"
takeaway: "Договор членится на разделы «Предмет → Обязанности → Ответственность → Срок»; нумерация 1.1/1.2 однозначна."
inputs: [brief, deliverable_dir, "docs/dogovor.md"]
outputs: [docs]
steps:
  - "Определить предмет и стороны"
  - "Заполнить обязательные разделы"
  - "Сверить нумерацию и реквизиты"
  - "Проверить анти-слоп студии"
checks:
  - "К-01 Тип документа и стороны с полными реквизитами"
  - "К-02 Все существенные условия предмета по ГК РФ"
  - "К-14 Формальные атрибуты: нумерация, приложения, подписи"
  - "К-13 Дисклеймер «не является юридической консультацией»"
  - "V-01…V-15 приёмка студии"
applies_to: [legal_docs]