name: versioning
title: "Версионирование документа и сноски на НПА"
description: "Оформляет шапку версии (дата, место, номер редакции) и сноски на нормативные акты с указанием редакции/даты в SOURCES.md; каждый документ, ссылающийся на ГК РФ, обязан иметь сноску на акт с редакцией."
source: "REF-07"
takeaway: "Документ версионируется датой и номером редакции; сноска на НПА без редакции/даты считается нарушением (К-10, К-12)."
inputs: [brief, deliverable_dir, "docs/dogovor.md", "docs/SOURCES.md"]
outputs: [docs]
steps:
  - "Указать дату, место и номер редакции в шапке документа"
  - "Проверить, что актуальная форма не устарела (B-07)"
  - "Собрать сноски на НПА в SOURCES.md"
  - "Указать редакцию/дату для каждой сноски"
  - "Проверить, что каждый акт из текста имеет сноску"
checks:
  - "К-10 Версионирование: дата, место, номер редакции"
  - "К-12 Сноски на НПА с редакцией/датой"
  - "V-10 метаданные версии (дата + г. Москва + Редакц)"
  - "V-12 SOURCES.md: ГК РФ + ред. от"
  - "B-07 Нет неактуальных форм (дата в прошлом)"
  - "B-02 Нет ссылки на НПА без редакции"
applies_to: [legal_docs]