name: requisites
title: "Проверка реквизитов по контрольным суммам"
description: "Проверяет реквизиты сторон по контрольным суммам: ИНН (10/12 знаков) и ОГРН/ОГРНИП (13/15 знаков) через isValidInn/isValidOgrn, сверяет их между разделами «Стороны» и «Реквизиты» и не принимает документ с непроверенными номерами."
source: "REF-04"
takeaway: "Реквизиты принимаются только после проверки контрольных сумм: ИНН — модуль 11, ОГРН — модуль 11/13 (К-05, B-08)."
inputs: [brief, deliverable_dir, "docs/dogovor.md"]
outputs: [docs]
steps:
  - "Собрать все ИНН/ОГРН/ОГРНИП из текста документа"
  - "Проверить ИНН 10/12 по контрольной сумме (isValidInn)"
  - "Проверить ОГРН 13/ОГРНИП 15 по контрольной сумме (isValidOgrn)"
  - "Сверить реквизиты из раздела «Стороны» с разделом «Реквизиты»"
  - "Зафиксировать невалидные номера в отчёте и не принимать документ"
checks:
  - "К-05 Реквизиты валидны по контрольным суммам"
  - "V-05 innChecksum/ogrnChecksum по документу"
  - "B-08 Нет непроверенных контрольных сумм реквизитов"
applies_to: [legal_docs]