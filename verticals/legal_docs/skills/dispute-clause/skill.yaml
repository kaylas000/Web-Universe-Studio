name: dispute-clause
title: "Условия об ответственности и порядок споров"
description: "Собирает блок «Ответственность и споры» (К-08) и «Изменение и расторжение» (К-09): неустойка и убытки, обязательный претензионный порядок с указанием срока ответа, подсудность, а также порядок изменения и расторжения без самоотменяющих пунктов."
source: "REF-05"
takeaway: "Споры урегулируются только после обязательной претензии; ответственность не сводится к одной пене — убытки возмещаются в непокрытой части (К-08, К-09)."
inputs: [brief, deliverable_dir, "docs/dogovor.md"]
outputs: [docs]
steps:
  - "Определить ответственность сторон (неустойка, убытки)"
  - "Описать претензионный порядок со сроком ответа"
  - "Указать подсудность (суд) при недостижении соглашения"
  - "Описать порядок изменения и расторжения договора"
  - "Проверить, что пункты не отменяют друг друга"
checks:
  - "К-08 Ответственность сторон и порядок споров"
  - "К-09 Порядок изменения и расторжения"
  - "V-08 раздел «Ответственность» + претензия + суд"
  - "V-09 изменение/расторжение описаны"
  - "B-06 Нет формулировок, запрещающих споры"
applies_to: [legal_docs]