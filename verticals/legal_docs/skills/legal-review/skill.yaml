name: legal-review
title: "Юридическое ревью документа"
description: "Проводит ревью готового документа по чек-листу: стороны, предмет, цена, срок, ответственность, применимое право; фиксирует нарушения статей студии и не пропускает документ до устранения."
source: "REF-03"
takeaway: "Ревью идёт по чек-листу: стороны, предмет, цена, срок, ответственность, применимое право."
inputs: [brief, deliverable_dir, "docs/dogovor.md"]
outputs: [docs]
steps:
  - "Разобрать бриф"
  - "Собрать артефакт по закону студии"
  - "Отдать на приёмку"
  - "Провести ревью по чек-листу и зафиксировать замечания"
checks:
  - "К-02 Существенные условия по чек-листу"
  - "К-04 Нет внутренних противоречий"
  - "К-15 Флаг HITL для критического документа"
  - "G4 Юр-ревью человеком (HITL)"
applies_to: [legal_docs]