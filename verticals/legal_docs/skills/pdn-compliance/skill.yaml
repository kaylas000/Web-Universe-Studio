name: pdn-compliance
title: "Обработка персональных данных по 152-ФЗ"
description: "Проверяет разделы, где обрабатываются персональные данные (ПДн): указаны цели обработки, срок хранения и основание в виде согласия субъекта, со ссылкой на 152-ФЗ; не допускает обработку ПДн без основания."
source: "REF-06"
takeaway: "ПДн обрабатываются только при наличии цели, срока и согласия субъекта — иначе обработка без основания (К-07, B-05)."
inputs: [brief, deliverable_dir, "docs/dogovor.md"]
outputs: [docs]
steps:
  - "Найти упоминания персональных данных в документе"
  - "Указать цели обработки ПДн"
  - "Указать срок обработки/хранения ПДн"
  - "Описать основание — согласие субъекта и его отзыв"
  - "Сослаться на 152-ФЗ и проверить полноту обвязки"
checks:
  - "К-07 Обработка ПДн по 152-ФЗ: цели, срок, согласие"
  - "V-07 implies: персональн → 152-ФЗ/цел/срок/соглас"
  - "B-05 Нет ПДн без основания обработки"
applies_to: [legal_docs]