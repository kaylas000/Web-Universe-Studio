    filters: [категория, превью]

# ── Минимум референсов на студию (таблица источников, §8 плана) ──────────────────
minimums:
  web_studio: 100
  mini_apps: 50
  mobile_apps: 80

rules:
  require_takeaway: true      # запись без takeaway не принимается (К-04)
  max_per_run: 50
  min_takeaway_len: 20
  store_index: "references/INDEX.md"
  store_metadata: "references/metadata/"