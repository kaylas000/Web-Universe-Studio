# ЦЕХ · метаплатформа — источники архива референсов (§12.4 ТЗ).
# Каждая студия при создании заполняет базу референсов из каталогов-доноров своего домена
# (полные таблицы — TECHNICAL_SPECIFICATION.md §12.4). Используется scripts/scrape_references.mjs:
# обход источников, изъятие приёмов с обязательным takeaway (К-04).
# По умолчанию всё OFFLINE: сетевой обход включается только явным --fetch и без ключей.
default_policy: manual

sources:
  # ── web_studio · лендинги и одностраничники (§12.4.1) ─────────────────────────────
  - id: wb-land-book
    vertical: web_studio
    kind: catalog
    url: "https://land-book.com"
    enabled: false
    take: Скриншоты полных страниц
    filters: [цвет, тип, индустрия]
  - id: wb-lapa-ninja
    vertical: web_studio
    kind: catalog
    url: "https://lapa.ninja"
    enabled: false
    take: 7300+ лендингов с полностраничными скриншотами
    filters: [SaaS, крипто, образование]
  - id: wb-landingfolio
    vertical: web_studio
    kind: catalog
    url: "https://landingfolio.com"
    enabled: false
    take: Лендинги и UI-компоненты
    filters: [hero, pricing, FAQ]
  - id: wb-onepagelove
    vertical: web_studio
    kind: catalog
    url: "https://onepagelove.com"
    enabled: false
    take: Одностраничники
    filters: [портфолио, продукт, ивент]
  - id: wb-saaslandingpage
    vertical: web_studio
    kind: catalog
    url: "https://saaslandingpage.com"
    enabled: false
    take: SaaS-лендинги
    filters: [стиль, конверсия]

  # ── web_studio · полноценные сайты и стили (§12.4.2) ─────────────────────────────
