# ЦЕХ · метаплатформа — композиция без HITL: прогоняется офлайн насквозь (CI-демо).
# Показывает кросс-доменную сборку: аналитика продаж питает контент-пост.
apiVersion: autogen/v1
kind: Composition
metadata:
  name: sales-post-with-data
  goal: "Разбор продаж и пост о выводе для блога"
tasks:
  - id: analytics
    vertical: data
    gate: G4
  - id: article
    vertical: content
    gate: G4
    needs: [analytics]
aggregate:
  mode: all
  deliverable: "verticals/*/workspace/loop-result.json"
