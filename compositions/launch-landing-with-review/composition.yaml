# ЦЕХ · метаплатформа — композиция (§13.1 ТЗ)
# Задачи образуют DAG; каждая вершина наследует конституцию своей вертикали.
# Задача с hitl: true не закрывается без вердикта человека (G4, К-09).
apiVersion: autogen/v1
kind: Composition
metadata:
  name: launch-landing-with-review
  goal: "Лендинг запуска + ревью текстов + 3 поста"
tasks:
  - id: brief
    vertical: content
    gate: G1
    output: MARKETING.md
  - id: landing
    vertical: web
    gate: G4
    needs: [brief]
  - id: review
    vertical: content
    gate: G4
    needs: [brief]
    hitl: true
  - id: posts
    vertical: content
    gate: G4
    needs: [landing]
aggregate:
  mode: all
  deliverable: "verticals/*/workspace/loop-result.json"